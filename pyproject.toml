[project]
name = "wechat-article-for-ai"
version = "0.1.0"
description = "Convert WeChat Official Account articles to clean Markdown files with locally downloaded images."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "camoufox[geoip]",
    "markdownify",
    "beautifulsoup4",
    "httpx[socks]",
    "mcp",
]

[project.scripts]
wechat-to-md = "wechat_to_md.cli:main"
wechat-to-md-mcp = "wechat_to_md.mcp_server:run_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wechat_to_md"]
